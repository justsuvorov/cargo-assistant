{% set labels = {"queued": "В очереди", "waiting": "Ожидает профиль полиса", "running": "Выполняется", 'done': 'Готово', 'failed': 'Ошибка'} %}
<span id="job-{{ job.id }}" class="job"
  {% if not job.finished() %}hx-get="/jobs/{{ job.id }}/status" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  <span class="status-{{ job.status }}">{{ labels[job.status] }}</span>
  <progress value="{{ job.progress }}" max="100"></progress>
  {{ job.progress }}% {% if job.stage %}({{ job.stage }}){% endif %}
  {% if job.error %}<em>{{ job.error }}</em>{% endif %}
</span>
