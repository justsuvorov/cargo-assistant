field: destination
forms:
  vertical: {order: 10, title: "Пункт назначения"}
  psg: {order: 12, title: "Маршрут\nПункт назначения"}
subject: "Маршрут перевозок"
clause: territory
check: semantic
rule: >-
  Пункт заполнен. Если указано несколько пунктов через тире, проверяется каждый. Пункт не
  находится на исключённой территории ГП. Опечатки и обрезанный номер дома не являются
  расхождением. Одинаковые значения в одной декларации получают одинаковый результат.
params:
  exclusions: exclusions_territory
if_empty: mismatch
comments:
  match: "Соответствует маршруту ГП"
  mismatch: "Пункт «{entry}» на исключённой территории ({reference})"
  review: "Не удалось определить территорию пункта «{entry}»"
status: draft
evidence:
  - "76: пусто — ФСЦ: «не совпадает» верно"
  - "114/2: «ул. Двинская, 18/» — ФСЦ: адреса достаточно"
  - "271/2: г. Донецк — «не совпадает» верно"
clarify:
  - "114/4: «ДНР, ул. Двинская, 18/» — ожидаемый статус «не совпадает»?"
