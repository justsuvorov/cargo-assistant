field: transport
forms:
  vertical: {order: 7, title: "Транспорт"}
  psg: {order: 9, title: "Вид транспорта и перевозчик"}
subject: "Способ перевозки, Период ответственности Страховщика"
clause: transport
check: in_list
rule: >-
  Вид транспорта распознаётся кодом по словарю. Каждый распознанный вид входит в перечень
  разрешённых видов по ГП. Перевозчик в этом поле не обязателен. Перевозка смешанная,
  если указано «смешанный» или больше одного вида («Авто+авиа+авто»). «Авто с перегрузом
  на границе» — только авто. Если вид не распознан — требует проверки.
params:
  modes:
    auto: ["авто", "автомобильный", "автотранспорт", "грузовик", "truck", "road", "auto"]
    rail: ["ж/д", "жд", "железнодорожный", "rail", "railway"]
    air: ["авиа", "авиационный", "авиатранспорт", "авианакладная", "air"]
    sea: ["море", "морской", "судно", "sea", "vessel"]
    river: ["река", "речной", "river"]
    mixed: ["смешанный", "мультимодальный", "multimodal", "mixed"]
if_empty: mismatch
comments:
  match: "Вид транспорта допустим по ГП ({reference})"
  mismatch: "Вид транспорта «{entry}» не предусмотрен ГП ({reference})"
  review: "Вид транспорта не распознан"
status: draft
evidence:
  - "113, 114: «авто» — ФСЦ: указания авто достаточно, перевозчик не обязателен"
  - "76: «Авто с перегрузом на границе» — ФСЦ: это не смешанная перевозка, только авто"
  - "263: «в соответствии с п.8 ГП» — ФСЦ: допустимо по особым условиям клиента"
  - "70: ФСЦ: сверять с п. 8 ГП (способ перевозки), а не только с п. 7"
  - "005: «КАМАЗ … / КОГЕЛЬ …» — верно (совпадает)"
clarify:
  - "271: «Без перетарки из контейнера на всем маршруте» — как проверять это условие п. 8 ГП и в каком поле?"
  - "Марка машины без слова «авто» (005 КАМАЗ, 46 СКАНИЯ): считать автотранспортом по словарю марок или «требует проверки»?"
