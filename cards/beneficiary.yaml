  psg: {order: 6, title: "Выгодоприобретатель"}
subject: "Выгодоприобретатель"
clause: beneficiary
check: filled
rule: >-
  Поле заполнено наименованием с ОПФ. Пусто, «нет», «-» — не совпадает. Наименование без
