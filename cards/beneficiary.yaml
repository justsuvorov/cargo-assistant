  match: "Поле заполнено"
  mismatch: "Выгодоприобретатель не указан или указан без ОПФ"
  review: ""
status: draft
evidence:
  - "97: «нет» — ФСЦ: должно быть «не совпадает», данные пустые"
  - "70: «БЕКАР» — ФСЦ: данные неполные, не указана ОПФ"
clarify:
  - "Иностранная ОПФ (LLC, Ltd, GmbH) считается ОПФ?"
  - "Нужно ли сверять выгодоприобретателя с п. 3 ГП (например, допустим только страхователь)?"
