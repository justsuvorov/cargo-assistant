field: beneficiary
forms:
  vertical: {order: 5, title: "Выгодоприобретатель"}
  psg: {order: 6, title: "Выгодоприобретатель"}
subject: "Выгодоприобретатель"
clause: beneficiary
check: filled
rule: >-
  Поле заполнено наименованием с ОПФ. Пусто, «нет», «-» — не совпадает. Наименование без
  ОПФ — не совпадает (данные неполные). Иностранная ОПФ (LLC, Co., Ltd и подобные) — это
  ОПФ, совпадает (D-36). ОПФ, слитая со следующим словом без пробела («…LLCAddress…»), —
  требует проверки (D-36).
params:
  blank_words: ["нет", "-", "—", "no", "none", "n/a"]
  shape: party
  legal_forms: ["ООО", "АО", "ПАО", "ЗАО", "ОАО", "НАО", "ИП", "ГУП", "МУП", "ФГУП", "АНО",
    "Общество с ограниченной ответственностью", "Акционерное общество",
    "Публичное акционерное общество", "Непубличное акционерное общество",
    "Закрытое акционерное общество", "Открытое акционерное общество",
    "Индивидуальный предприниматель"]
  foreign_forms: ["LLC", "Co.", "Ltd", "Limited", "GmbH", "Inc", "Corp", "Corporation", "JSC",
    "LLP", "PLC", "AG", "S.A.", "B.V.", "ТОО"]
  party: {foreign: match, fused: review, latin: mismatch, unformed: mismatch}
if_empty: mismatch
comments:
  match: "Поле заполнено"
  mismatch: "Выгодоприобретатель не указан или указан без ОПФ"
  review: "Нужна проверка выгодоприобретателя"
  fused: "ОПФ выгодоприобретателя слита со следующим словом, нужна проверка"
  policy_missing: "В декларации не указан номер ГП, сверка с полисом не выполнена"
  policy_unreadable: "Номер ГП в декларации не распознан, сверка с полисом не выполнена"
  policy_unknown: "Полис с номером из декларации не найден, сверка с полисом не выполнена"
  policy_ambiguous: "Найдено несколько полисов с номером из декларации, сверка с полисом не выполнена"
  policy_profile: "Профиль полиса не собран, сверка с полисом не выполнена"
status: draft
evidence:
  - "97: «нет» — ФСЦ: должно быть «не совпадает», данные пустые"
  - "70: наименование без ОПФ — ФСЦ: данные неполные, не указана ОПФ"
  - "Иностранная ОПФ (LLC, Co., Ltd) считается ОПФ — ФСЦ 13.11.2026, Ф-22 (D-36)"
  - "76, 107: ОПФ слита с адресом без пробела — ФСЦ 13.11.2026, Ф-23: «требует проверки» (D-36); эталон v1 ждёт «совпадает»"
clarify:
  - "Нужно ли сверять выгодоприобретателя с п. 3 ГП (например, допустим только страхователь)?"
