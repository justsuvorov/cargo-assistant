field: cargo
forms:
  vertical: {order: 3, title: "Полное наименование груза"}
  psg: {order: 5, title: "Наименование груза"}
subject: "Объект страхования"
clause: object
check: semantic
rule: >-
  Проверить каждую позицию груза отдельно. Позиция совпадает, если относится к объекту
  страхования и не входит в исключения. Позиция из исключений — не совпадает. Если по
  наименованию нельзя определить нужное свойство (например, скоропортящийся груз или нет)
  — требует проверки. Итоговый статус строки — худший из статусов позиций.
params:
  exclusions: exclusions_cargo
if_empty: mismatch
comments:
  match: "Соответствует объекту страхования ({reference})"
  mismatch: "Позиция «{entry}» входит в исключения ({reference})"
  review: "По позиции «{entry}» нельзя определить категорию груза"
status: draft
evidence:
  - "113/1: «Продукты, Бумага, мех» — ФСЦ: мех в исключениях; по «продукты» нельзя понять, скоропорт или нет"
  - "113/3: «Бумага, почта» — ФСЦ: почтовые отправления в исключениях"
  - "263: «в соответствии с п.5 ГП» — верно (совпадает)"
  - "35: «ТНП» — ФСЦ: надо было сверить с п. 5 ГП"
clarify:
  - "35: какой ожидаемый статус для «ТНП» — совпадает или требует проверки?"
  - "97: «мясо» — ФСЦ спросили «почему соответствует?». Ожидаемый статус?"
  - "Порядок статусов для итога строки: не совпадает > требует проверки > совпадает — верно?"
