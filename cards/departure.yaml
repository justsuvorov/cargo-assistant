field: departure
forms:
  vertical: {order: 8, title: "Пункт отправления"}
  psg: {order: 10, title: "Маршрут\nПункт отправления"}
subject: "Маршрут перевозок"
clause: territory
check: semantic
rule: >-
  Пункт заполнен. Если указано несколько пунктов через тире, проверяется каждый. Пункт не
  находится на исключённой территории ГП. Опечатки и сокращения не являются расхождением.
  Достаточно города или терминала (например, «EXW Guangzhou»). Одинаковые значения в одной
  декларации получают одинаковый результат.
  Если территория покрытия ГП — «весь мир» со ссылкой на перечень JCC, страна, явно
  названная в пункте территории (п. 9), сверяется с ним; страна, не названная явно, —
  требует проверки: перечень JCC сервис не проверяет (D-37).
params:
  exclusions: exclusions_territory
if_empty: mismatch
comments:
  match: "Соответствует маршруту ГП"
  mismatch: "Пункт «{entry}» на исключённой территории ({reference})"
  review: "Не удалось определить территорию пункта «{entry}»"
  empty: "Пункт отправления не указан"
  unanswered: "Смысловая проверка не дала ответа"
  policy_missing: "В декларации не указан номер ГП, сверка с полисом не выполнена"
  policy_unreadable: "Номер ГП в декларации не распознан, сверка с полисом не выполнена"
  policy_unknown: "Полис с номером из декларации не найден, сверка с полисом не выполнена"
  policy_ambiguous: "Найдено несколько полисов с номером из декларации, сверка с полисом не выполнена"
  policy_profile: "Профиль полиса не собран, сверка с полисом не выполнена"
status: draft
evidence:
  - "76: пусто — ФСЦ: «не совпадает» верно"
  - "107: «EXW Guanghzou» — ФСЦ: полный адрес не требуется"
  - "113/1: «Моосковская обл» — ФСЦ: опечатки не расхождение; в поле указаны и отправление, и назначение — проверить оба"
  - "114/1 и 114/2: один и тот же адрес получил разные результаты — ФСЦ: некорректно"
  - "271/2: г. Донецк — «не совпадает» верно (исключённая территория)"
  - "69: покрытие «весь мир» со ссылкой на перечень JCC — ФСЦ 13.11.2026, Ф-28: страна, не названная в п. 9, — «требует проверки» (D-37)"
clarify: []
