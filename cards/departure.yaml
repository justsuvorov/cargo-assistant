field: departure
forms:
  vertical: {order: 8, title: "Пункт отправления"}
  psg: {order: 10, title: "Маршрут\nПункт отправления"}
subject: "Маршрут перевозок"
clause: territory
check: semantic
rule: >-
  Пункт заполнен. Если указано несколько пунктов через тире, проверяется каждый. Пункт не
  находится на исключённой территории ГП. Опечатки и сокращения не являются расхождением.
  Достаточно города или терминала (например, «EXW Guangzhou»). Одинаковые значения в одной
  декларации получают одинаковый результат.
params:
  exclusions: exclusions_territory
if_empty: mismatch
comments:
  match: "Соответствует маршруту ГП"
  mismatch: "Пункт «{entry}» на исключённой территории ({reference})"
  review: "Не удалось определить территорию пункта «{entry}»"
status: draft
evidence:
  - "76: пусто — ФСЦ: «не совпадает» верно"
  - "107: «EXW Guanghzou» — ФСЦ: полный адрес не требуется"
  - "113/1: «Моосковская обл» — ФСЦ: опечатки не расхождение; в поле указаны и отправление, и назначение — проверить оба"
  - "114/1 и 114/2: один и тот же адрес получил разные результаты — ФСЦ: некорректно"
  - "271/2: г. Донецк — «не совпадает» верно (исключённая территория)"
clarify: []
