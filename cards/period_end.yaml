field: period_end
forms:
  psg: {order: 4, title: "Период страхования окончание"}
subject: "Срок действия Полиса"
clause: term
check: date_range
rule: >-
  Дата окончания не раньше даты начала. Дата окончания входит в срок действия ГП либо
  выходит за него, если в профиле есть пункт term_extension.
params:
  bounds: [end]
  extension: term_extension
if_empty: mismatch
comments:
  match: "Входит в срок действия ГП"
  mismatch: "Выходит за срок действия ГП (до {policy_end})"
  review: "Дата окончания не распознана"
status: draft
evidence:
  - "114/4, 114/5: окончание 21.09.2026 при сроке до 20.09.2026, полис продлевается до окончания ответственности по партии — ФСЦ: «самый верный ответ» (совпадает)"
  - "271/2: окончание 07.11.2026 при сроке до 31.08.2027 — ФСЦ: «не совпадает» неправильно"
clarify:
  - "Условие продления (term_extension) есть во всех ГП или только в некоторых?"
