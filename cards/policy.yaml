field: policy
forms:
  vertical: {order: 2, title: "№ Генерального полиса и дата"}
  psg: {order: 2, title: "№ Генерального полиса и дата"}
subject: "Преамбула договора"
clause: number
check: exact
rule: >-
  Номер ГП совпадает посимвольно после удаления пробелов и знака «№»; дата ГП совпадает
  с датой в преамбуле.
params:
  parts: [number, date]
  ignore: ["№"]
if_empty: mismatch
comments:
  match: "Совпадает с ГП"
  mismatch: "Не совпадает с номером или датой ГП ({reference})"
  review: "Номер или дата ГП не распознаны"
  empty: "Номер и дата ГП не указаны"
  policy_missing: "В декларации не указан номер ГП, сверка с полисом не выполнена"
  policy_unreadable: "Номер ГП в декларации не распознан, сверка с полисом не выполнена"
  policy_unknown: "Полис с номером из декларации не найден, сверка с полисом не выполнена"
  policy_ambiguous: "Найдено несколько полисов с номером из декларации, сверка с полисом не выполнена"
  policy_profile: "Профиль полиса не собран, сверка с полисом не выполнена"
status: draft
evidence:
  - "005, 263, 271: номер и дата совпадают — верно"
  - "114/2: MVP сравнил дату ГП с началом срока действия — ФСЦ: некорректно"
clarify:
  - "Декл. 263 и 274: в номере ГП стоит знак «$». Это часть номера или ошибка ввода?"
