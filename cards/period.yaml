field: period
forms:
  vertical: {order: 11, title: "Период страхования"}
subject: "Срок действия Полиса"
clause: term
check: date_range
rule: >-
  Дата начала перевозки входит в срок действия ГП в редакции на эту дату.
  Дата окончания не раньше даты начала. Дата окончания может выходить за срок действия,
  если в профиле есть пункт term_extension (полис действует до окончания ответственности
  по партиям, начатым в срок).
params:
  bounds: [start, end]
  extension: term_extension
if_empty: mismatch
comments:
  match: "Входит в срок действия ГП"
  mismatch: "Выходит за срок действия ГП ({policy_start} – {policy_end})"
  review: "Дата периода страхования не распознана"
status: draft
evidence:
  - "005, 76, 107: даты внутри срока — верно"
  - "70: срок продлён ДС 4 (изменение п. 6) — ФСЦ: сверять с ДС 4"
clarify:
  - "97: окончание 12.08.2026 раньше начала 12.09.2026 — это «не совпадает» или «требует проверки»?"
