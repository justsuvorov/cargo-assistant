field: period
forms:
  vertical: {order: 11, title: "Период страхования"}
subject: "Срок действия Полиса"
clause: term
check: date_range
rule: >-
  Дата начала перевозки входит в срок действия ГП в редакции на эту дату.
  Дата окончания не раньше даты начала: иначе «не совпадает» без сверки со сроком ГП (D-35).
  Дата окончания может выходить за срок действия, если в профиле есть пункт term_extension
  (полис действует до окончания ответственности по партиям, начатым в срок).
params:
  bounds: [start, end]
  extension: term_extension
  end_before_start: mismatch
if_empty: mismatch
comments:
  match: "Входит в срок действия ГП"
  mismatch: "Выходит за срок действия ГП ({policy_start} – {policy_end})"
  review: "Дата периода страхования не распознана"
  empty: "Период страхования не указан"
  end_before_start: "Дата окончания раньше даты начала"
  clause_unreadable: "Срок действия ГП в профиле полиса не распознан"
  policy_missing: "В декларации не указан номер ГП, сверка с полисом не выполнена"
  policy_unreadable: "Номер ГП в декларации не распознан, сверка с полисом не выполнена"
  policy_unknown: "Полис с номером из декларации не найден, сверка с полисом не выполнена"
  policy_ambiguous: "Найдено несколько полисов с номером из декларации, сверка с полисом не выполнена"
status: draft
evidence:
  - "005, 76, 107: даты внутри срока — верно"
  - "70: срок продлён ДС 4 (изменение п. 6) — ФСЦ: сверять с ДС 4"
  - "97: окончание раньше начала — ФСЦ: «не совпадает» (D-35)"
