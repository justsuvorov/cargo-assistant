field: sum
forms:
  vertical: {order: 6, title: "Страховая сумма"}
  psg: {order: 13, title: "Страховая сумма"}
subject: "Страховая сумма/лимит ответственности"
clause: limit
check: lte_limit
rule: >-
  Страховая сумма по перевозке не больше лимита на одну перевозку (партию) по ГП в редакции
  на дату начала перевозки. ДС, заключённое к конкретной декларации, применяется только
  к ней. Если валюта суммы отличается от валюты лимита, сумма не пересчитывается и не
  сравнивается; статус «требует проверки», ответ в валюте декларации.
params:
  foreign_currency: review
if_empty: mismatch
comments:
  match: "Совпадает согласно лимиту по ГП"
  mismatch: "Превышает лимит {limit} ({reference})"
  review: "Сумма {amount} в валюте декларации, лимит по ГП {limit}; сравнение не выполнялось"
status: draft
evidence:
  - "76, 97, 107: ДС 4 заключено к конкретной отгрузке — ФСЦ: применять не нужно"
  - "70: ФСЦ: сверять с п. 12 ГП/ДС, ставка премии не относится к делу"
  - "97: сумма 920 000 000 при лимите 900 000 000 — «не совпадает» (пользователь: разметка ФСЦ ошибочна, D-23)"
  - "70, 164: валюта суммы отличается от валюты лимита — не пересчитываем, ответ в валюте декларации, статус «требует проверки» (D-22)"
clarify:
  - "113, 114: сравнивать с лимитом каждую строку или итог декларации?"
