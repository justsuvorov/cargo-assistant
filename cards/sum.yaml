field: sum
forms:
  vertical: {order: 6, title: "Страховая сумма"}
  psg: {order: 13, title: "Страховая сумма"}
subject: "Страховая сумма/лимит ответственности"
clause: limit
check: lte_limit
rule: >-
  Страховая сумма по перевозке не больше лимита на одну перевозку (партию) по ГП в редакции
  на дату начала перевозки. ДС, заключённое к конкретной декларации, применяется только
  к ней. Суммы в разных валютах без курса не сравниваются — требует проверки.
params:
  currency: from_field
if_empty: mismatch
comments:
  match: "Совпадает согласно лимиту по ГП"
  mismatch: "Превышает лимит {limit} ({reference})"
  review: "Валюта суммы отличается от валюты лимита, нужен курс"
status: draft
evidence:
  - "76, 97, 107: ДС 4 заключено к конкретной отгрузке — ФСЦ: применять не нужно"
  - "70: ФСЦ: сверять с п. 12 ГП/ДС, ставка премии не относится к делу"
  - "97: ФСЦ просит короткий комментарий «Совпадает согласно лимиту по ГП»"
clarify:
  - "97: сумма 920 000 000 при лимите 900 000 000. MVP поставил «не совпадает», ФСЦ: «Верно», но просит комментарий «Совпадает согласно лимиту по ГП». Какой статус правильный?"
  - "Сумма в EUR/CNY при лимите в RUB: по какому курсу и на какую дату пересчитывать?"
  - "113, 114: сравнивать с лимитом каждую строку или итог декларации?"
