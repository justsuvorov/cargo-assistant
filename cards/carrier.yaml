field: carrier
forms:
  vertical: {order: 13, title: "Перевозчик"}
subject: "НЕ СВЕРЯЕТСЯ, ПРОВЕРЯЕТСЯ ФАКТ ЗАПОЛНЕНИЯ\nОПФ+НАИМЕНОВАНИЕ"
clause: carriers
check: conditional
rule: >-
  Если в ГП есть риск, требующий сверки с перечнем перевозчиков (пункт carrier_risk
  в профиле, например 3.4.28), перевозчик входит в перечень. Иначе проверяется только
  факт заполнения: ОПФ и наименование. Иностранная ОПФ (LLC, Co., Ltd и подобные) — это
  ОПФ, совпадает. ОПФ, слитая со следующим словом без пробела, — требует проверки.
  Перевозчик без ОПФ: иностранный (название только латиницей) — совпадает, иначе
  (резидент) — требует проверки (D-36).
params:
  when: carrier_risk
  then: in_list
  else: filled
  shape: party
  legal_forms: ["ООО", "АО", "ПАО", "ЗАО", "ОАО", "НАО", "ИП", "ГУП", "МУП", "ФГУП", "АНО",
    "Общество с ограниченной ответственностью", "Акционерное общество",
    "Публичное акционерное общество", "Непубличное акционерное общество",
    "Закрытое акционерное общество", "Открытое акционерное общество",
    "Индивидуальный предприниматель"]
  foreign_forms: ["LLC", "Co.", "Ltd", "Limited", "GmbH", "Inc", "Corp", "Corporation", "JSC",
    "LLP", "PLC", "AG", "S.A.", "B.V.", "ТОО"]
  party: {foreign: match, fused: review, latin: match, unformed: review}
if_empty: mismatch
comments:
  match: "Перевозчик указан"
  mismatch: "Перевозчик не указан или его нет в перечне перевозчиков ({reference})"
  review: "Не удалось сопоставить перевозчика с перечнем"
  empty: "Перевозчик не указан"
  incomplete: "Перевозчик указан без наименования"
  fused: "ОПФ перевозчика слита со следующим словом, нужна проверка"
  latin: "Иностранный перевозчик указан без ОПФ"
  unformed: "Перевозчик указан без ОПФ, нужна проверка"
  policy_missing: "В декларации не указан номер ГП, сверка с полисом не выполнена"
  policy_unreadable: "Номер ГП в декларации не распознан, сверка с полисом не выполнена"
  policy_unknown: "Полис с номером из декларации не найден, сверка с полисом не выполнена"
  policy_ambiguous: "Найдено несколько полисов с номером из декларации, сверка с полисом не выполнена"
  policy_profile: "Профиль полиса не собран, сверка с полисом не выполнена"
status: draft
evidence:
  - "Строки «Перевозчик» в результате ПСГ-формы нет (D-28)"
  - "97, 107: ФСЦ: проверка по перечню не требуется, нет риска 3.4.28"
  - "76: ФСЦ: сверка перевозчиков нужна, только если в договоре есть риск 3.4.28"
  - "005: риск включён, перевозчик в перечне — совпадает; комментарий не должен ничего додумывать"
  - "97, 107: иностранная ОПФ (Co., Ltd) — ФСЦ 13.11.2026, Ф-22: «совпадает» (D-36)"
  - "Иностранный перевозчик без ОПФ — «совпадает», резидент — «требует проверки»; иностранный — название только латиницей (Ф-27, решение пользователя, D-36)"
  - "ОПФ, слитая со следующим словом, — «требует проверки» (Ф-23, D-36)"
clarify:
  - "76: перевозчик пуст — ожидаемый статус «не совпадает»?"
