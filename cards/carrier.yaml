field: carrier
forms:
  vertical: {order: 13, title: "Перевозчик"}
subject: "НЕ СВЕРЯЕТСЯ, ПРОВЕРЯЕТСЯ ФАКТ ЗАПОЛНЕНИЯ\nОПФ+НАИМЕНОВАНИЕ"
clause: carriers
check: conditional
rule: >-
  Если в ГП есть риск, требующий сверки с перечнем перевозчиков (пункт carrier_risk
  в профиле, например 3.4.28), перевозчик входит в перечень. Иначе проверяется только
  факт заполнения: ОПФ и наименование.
params:
  when: carrier_risk
  then: in_list
  else: filled
  shape: party
if_empty: mismatch
comments:
  match: "Перевозчик указан"
  mismatch: "Перевозчик не указан или его нет в перечне перевозчиков ({reference})"
  review: "Не удалось сопоставить перевозчика с перечнем"
status: draft
evidence:
  - "97, 107: ФСЦ: проверка по перечню не требуется, нет риска 3.4.28"
  - "76: ФСЦ: сверка перевозчиков нужна, только если в договоре есть риск 3.4.28"
  - "005: риск включён, перевозчик в перечне — совпадает; комментарий не должен ничего додумывать"
clarify:
  - "35 (ПСГ, отдельная колонка «Наименование перевозчика»): нужна ли строка «Перевозчик» в результате ПСГ-формы?"
  - "76: перевозчик пуст — ожидаемый статус «не совпадает»?"
