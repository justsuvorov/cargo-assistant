field: transshipment
forms:
  vertical: {order: 9, title: "Пункт перегрузки (таможенного оформления)"}
  psg: {order: 11, title: "Маршрут\nПункт перегрузки / таможенного оформления"}
subject: "Маршрут перевозок, Период ответственности Страховщика"
clause: territory
check: conditional
rule: >-
  Если перевозка смешанная (см. карточку transport), пункт перегрузки обязан быть
  заполнен: пусто или «нет» — не совпадает. Если перевозка не смешанная, поле можно не
  заполнять: и пусто, и «нет», и указанный пункт — совпадает без дополнительной проверки.
params:
  when: transport.mixed
  blank_words: ["нет", "-", "—", "no", "none"]
  then_if_empty: mismatch
  else: match
if_empty: match
comments:
  match: "Перевозка не смешанная, заполнение не обязательно"
  mismatch: "При смешанной перевозке пункт перегрузки должен быть указан"
  review: ""
status: draft
evidence:
  - "113, 114, 35, 005: «нет» или пусто при авто — ФСЦ: допустимо, доп. проверка не требуется"
  - "271/1: смешанная перевозка, поле пустое — ФСЦ: должно быть заполнено"
  - "97: «Авто+авиа+авто», поле пустое — ФСЦ: обязательно при смешанной перевозке"
  - "263: «по решению перевозчика» — допустимо по особым условиям клиента"
clarify:
  - "Если пункт перегрузки указан, нужно ли сверять его с исключёнными территориями (70: а/п Баку)?"
  - "Какой комментарий при заполненном поле в смешанной перевозке — «Пункт перегрузки указан»?"
