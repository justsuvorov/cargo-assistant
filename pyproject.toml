[project]
name = "cargo-assistant"
version = "0.1.0"
description = "Сверка деклараций с генеральным полисом страхования грузов"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pyhamcrest>=2.1",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "C4", "C90", "D101", "D106", "E", "ERA", "F", "FBT", "I", "N",
    "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "SLF", "T20", "TID", "UP", "W",
]
ignore = ["PT009", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "FBT003"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_expr = false
warn_unreachable = true
files = ["app", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:logging -p no:cacheprovider --strict-markers"
timeout = 10
xfail_strict = true
