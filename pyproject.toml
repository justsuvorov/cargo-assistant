[project]
name = "cargo-assistant"
version = "0.1.0"
description = "Сверка деклараций с генеральным полисом страхования грузов"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.30",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pyhamcrest>=2.1",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
    "types-xlrd>=2.0",
    "xlwt>=1.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "C4", "C90", "D101", "D106", "E", "ERA", "F", "FBT", "I", "N",
    "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "SLF", "T20", "TID", "UP", "W",
]
ignore = ["PT009", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "FBT003"]
"app/ingest/doc.py" = ["S603"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_expr = false
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."
files = ["app", "tools", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:logging -p no:cacheprovider --strict-markers"
timeout = 10
xfail_strict = true

[[tool.mypy.overrides]]
module = ["app.core.schema.*", "app.llm.schema.*", "app.policy.schema.*", "app.rules.schema.*", "tests.llm.answers"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["xlwt"]
ignore_missing_imports = true
