name: cargo-assistant-test

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
      POSTGRES_DB: cargo_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo -d cargo_test"]
      interval: 2s
      timeout: 3s
      retries: 30
