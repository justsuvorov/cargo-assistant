x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+asyncpg://cargo:${POSTGRES_PASSWORD:-cargo}@postgres:5432/cargo
    STORAGE_DIR: /data/storage
    AUTH_DEV_MODE: ${AUTH_DEV_MODE:-true}
    KEYCLOAK_URL: ${KEYCLOAK_URL:-}
    KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
    KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-vsk}
    LLM_ALLOW_EXTERNAL: ${LLM_ALLOW_EXTERNAL:-false}
    LLM_API_URL: ${LLM_API_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-prompt}
    LLM_THINKING_BUDGET: ${LLM_THINKING_BUDGET:-0}
    LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
    LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
    LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
    LLM_TOTAL_TIMEOUT: ${LLM_TOTAL_TIMEOUT:-300}
    LLM_RETRY_ATTEMPTS: ${LLM_RETRY_ATTEMPTS:-5}
    LLM_RETRY_PAUSE: ${LLM_RETRY_PAUSE:-5}
    LLM_EMPTY_ATTEMPTS: ${LLM_EMPTY_ATTEMPTS:-3}
    LLM_EMPTY_PAUSE: ${LLM_EMPTY_PAUSE:-1}
    LLM_VERIFY_TLS: ${LLM_VERIFY_TLS:-true}
    LLM_CA_BUNDLE: ${LLM_CA_BUNDLE:-}
    ANTHROPIC_API_URL: ${ANTHROPIC_API_URL:-https://api.anthropic.com/v1/messages}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
    GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-}
    WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-2}
  volumes:
    - storage:/data/storage
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargo}
      POSTGRES_DB: cargo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
