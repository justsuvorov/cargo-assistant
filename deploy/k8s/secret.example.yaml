# Шаблон секрета cargo-secret: значения пустые, настоящие в git не попадают.
# Создайте настоящий секрет вне git одним из способов:
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml   (файл в .gitignore),
#   заполните значения и выполните kubectl apply -f deploy/k8s/secret.yaml;
# либо без файла:
#   kubectl create secret generic cargo-secret \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://пользователь:пароль@хост:5432/cargo' \
#     --from-literal=LLM_API_KEY='ключ шлюза'
# ANTHROPIC_API_KEY и GEMINI_API_KEY нужны только для разработки на обезличенных данных.
apiVersion: v1
kind: Secret
metadata:
  name: cargo-secret
  namespace: cargo-assistant
type: Opaque
stringData:
  DATABASE_URL: ""
  LLM_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
