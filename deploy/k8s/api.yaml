apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-api
  namespace: cargo-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-api
  template:
    metadata:
      labels:
        app: cargo-api
    spec:
      containers:
        - name: api
          image: registry.example.invalid/cargo-assistant:replace-with-tag
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cargo-config
            - secretRef:
                name: cargo-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /data/storage
            - name: ca
              mountPath: /etc/cargo-ca
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: cargo-storage
        - name: ca
          configMap:
            name: cargo-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: cargo-api
  namespace: cargo-assistant
spec:
  selector:
    app: cargo-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargo-api
  namespace: cargo-assistant
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "300m"
spec:
  ingressClassName: replace-with-class
  rules:
    - host: cargo.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cargo-api
                port:
                  number: 80
