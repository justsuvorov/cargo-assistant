apiVersion: batch/v1
kind: Job
metadata:
  name: cargo-migrate
  namespace: cargo-assistant
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.example.invalid/cargo-assistant:replace-with-tag
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: cargo-config
            - secretRef:
                name: cargo-secret
