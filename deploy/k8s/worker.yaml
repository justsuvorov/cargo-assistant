apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-worker
  namespace: cargo-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-worker
  template:
    metadata:
      labels:
        app: cargo-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: registry.example.invalid/cargo-assistant:replace-with-tag
          command: ["python", "-m", "app.jobs"]
          envFrom:
            - configMapRef:
                name: cargo-config
            - secretRef:
                name: cargo-secret
          volumeMounts:
            - name: storage
              mountPath: /data/storage
            - name: ca
              mountPath: /etc/cargo-ca
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: cargo-storage
        - name: ca
          configMap:
            name: cargo-ca
            optional: true
